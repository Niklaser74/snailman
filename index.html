<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#4c9a3f">
<meta name="description" content="Snailman – Pac-Man där jägarna jagar i snigelfart och du inte får korsa ditt eget slem. Snailman: Pac-Man with a snail, where your own slime trail is the maze.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Snailman">
<title>Snailman</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="snails.se">
<meta property="og:title" content="Snailman – Pac-Man, only slow">
<meta property="og:description" content="Jägarna jagar i snigelfart, och du får inte korsa ditt eget slem. / The hunters hunt at snail speed, and you may not cross your own slime.">
<meta property="og:image" content="https://snails.se/snailman/icons/og-1200x630.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://snails.se/snailman/">
<link rel="canonical" href="https://snails.se/snailman/">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="stage">
  <canvas id="maze" data-i18n-aria="aria.maze" aria-label="Labyrinten"></canvas>
  <div id="banner" class="banner" hidden></div>
</div>

<!-- HUD -->
<div id="hud" hidden>
  <div class="hud-top">
    <div class="stat"><span class="label" data-i18n="hud.score">Poäng</span><span id="hud-score" class="value">0</span></div>
    <div class="stat best"><span class="label" data-i18n="hud.best">Rekord</span><span id="hud-best" class="value">0</span></div>
    <div class="stat"><span class="label" data-i18n="hud.level">Nivå</span><span id="hud-level" class="value">1</span></div>
    <div class="stat lives"><span class="label" data-i18n="hud.lives">Liv</span><canvas id="hud-lives" width="72" height="24" aria-hidden="true"></canvas></div>
    <div class="stat target" id="hud-target-box" hidden><span class="label" id="hud-target-label"></span><span id="hud-target" class="value"></span></div>
    <div class="hud-btns">
      <button id="btn-mute" class="icon-btn" aria-label="Ljud av">🔊</button>
      <button id="btn-menu" class="icon-btn" data-i18n-aria="aria.menu" aria-label="Meny">☰</button>
    </div>
  </div>
  <div id="replay-bar" class="replay-bar" hidden>
    <span id="replay-title"></span>
    <button id="btn-replay-speed" class="icon-btn wide-icon">1×</button>
    <button id="btn-replay-close" class="icon-btn" data-i18n-aria="aria.close" aria-label="Stäng">✕</button>
  </div>
</div>

<!-- the cross -->
<div id="pad" class="pad" hidden>
  <button id="btn-up" class="pad-btn up" data-i18n-aria="aria.up" aria-label="Upp">▲</button>
  <button id="btn-left" class="pad-btn left" data-i18n-aria="aria.left" aria-label="Vänster">◀</button>
  <button id="btn-right" class="pad-btn right" data-i18n-aria="aria.right" aria-label="Höger">▶</button>
  <button id="btn-down" class="pad-btn down" data-i18n-aria="aria.down" aria-label="Ner">▼</button>
</div>

<!-- Menu -->
<div id="menu" class="overlay">
  <div class="panel">
    <div class="lang" role="group" aria-label="Språk">
      <button data-lang="sv" aria-pressed="true">SV</button>
      <button data-lang="en" aria-pressed="false">EN</button>
    </div>
    <h1 data-i18n="app.name">Snailman</h1>
    <p class="tagline" data-i18n="app.tagline">Pac-Man där jägarna jagar i snigelfart — och du inte får korsa ditt eget slem.</p>
    <div class="actions">
      <button id="btn-continue" class="btn secondary" hidden data-i18n="menu.continue">Fortsätt spelet</button>
      <button id="btn-start" class="btn primary" data-i18n="menu.start">Nytt spel</button>
      <button id="btn-daily" class="btn secondary wide" data-i18n="menu.daily">Dagens labyrint</button>
      <button id="btn-post" class="btn secondary" data-i18n="menu.post">Snigelpost</button>
      <button id="btn-board" class="btn secondary" data-i18n="menu.board">Topplista</button>
      <button id="btn-help" class="btn secondary" data-i18n="menu.help">Så spelar du</button>
      <button id="btn-install" class="btn secondary" hidden data-i18n="menu.install">Installera app</button>
    </div>
    <p id="daily-line" class="hint"></p>
    <p id="offline-hint" class="hint"></p>
    <footer>
      <span data-i18n="app.by">En <a href="https://knackpot.se" target="_blank" rel="noopener">Knackpot</a>-produkt</span>
      · <a href="https://snails.se/" data-i18n="app.hub">Fler snigelspel på snails.se</a>
      · <a href="https://snails.se/privacy.html" data-i18n="app.privacy">Integritet</a>
      · <span id="menu-version"></span>
    </footer>
  </div>
</div>

<!-- Help -->
<div id="help" class="overlay" hidden>
  <div class="panel">
    <h2 data-i18n="help.title">Så spelar du</h2>
    <p data-i18n="help.1"></p>
    <p data-i18n="help.2"></p>
    <p data-i18n="help.3"></p>
    <p data-i18n="help.4"></p>
    <p data-i18n="help.5"></p>
    <p data-i18n="help.6"></p>
    <p data-i18n="help.7"></p>
    <div class="actions"><button id="btn-help-close" class="btn primary" data-i18n="help.close">Stäng</button></div>
  </div>
</div>

<!-- Game over -->
<div id="over" class="overlay" hidden>
  <div class="panel small">
    <h2 data-i18n="over.title">Uppäten</h2>
    <p id="over-why" class="why"></p>
    <p id="over-score" class="score"></p>
    <p id="over-level" class="why"></p>
    <p id="over-best" class="best"></p>
    <p id="over-online" class="online-line" hidden></p>
    <div class="actions">
      <button id="btn-over-contest" class="btn primary" hidden data-i18n="over.toContest">Till turneringen</button>
      <button id="btn-again" class="btn primary" data-i18n="over.again">Spela igen</button>
      <button id="btn-over-board" class="btn secondary" hidden data-i18n="menu.board">Topplista</button>
      <button id="btn-over-menu" class="btn secondary" data-i18n="over.menu">Till menyn</button>
    </div>
  </div>
</div>

<!-- Topplista -->
<div id="board" class="overlay" hidden>
  <div class="panel">
    <h2 data-i18n="board.title">Topplista</h2>
    <div class="tabs" role="tablist">
      <button data-board="today" role="tab" aria-selected="true" data-i18n="board.today">Idag</button>
      <button data-board="yesterday" role="tab" aria-selected="false" data-i18n="board.yesterday">Igår</button>
      <button data-board="records" role="tab" aria-selected="false" data-i18n="board.records">Rekord</button>
    </div>
    <p id="board-lead" class="hint left"></p>
    <ol id="board-list" class="board-list"></ol>
    <p id="board-me" class="hint left"></p>
    <p id="board-status" class="hint"></p>
    <div class="actions">
      <button id="btn-board-play" class="btn primary" data-i18n="board.play">Spela dagens labyrint</button>
      <button id="btn-board-close" class="btn secondary" data-i18n="common.close">Stäng</button>
    </div>
  </div>
</div>

<!-- Snigelpost: my tournaments -->
<div id="post" class="overlay" hidden>
  <div class="panel">
    <h2 data-i18n="post.title">Snigelpost</h2>
    <p class="hint left" data-i18n="post.blurb"></p>
    <label class="field"><span data-i18n="post.name">Ditt namn</span><input id="opt-name" maxlength="24" autocomplete="nickname"></label>
    <div class="row">
      <label class="field"><span data-i18n="post.rounds">Omgångar</span>
        <select id="opt-rounds"><option value="1" data-i18n="rounds.1">1</option><option value="3" selected data-i18n="rounds.3">3</option><option value="5" data-i18n="rounds.5">5</option></select></label>
      <label class="field"><span data-i18n="post.players">Spelare</span>
        <select id="opt-players"><option value="2" selected data-i18n="players.2">2</option><option value="3">3</option><option value="4">4</option><option value="6">6</option><option value="8">8</option></select></label>
    </div>
    <div class="actions"><button id="btn-post-create" class="btn primary" data-i18n="post.create">Skapa turnering</button></div>
    <h3 data-i18n="post.mine">Mina turneringar</h3>
    <ul id="post-list" class="post-list"></ul>
    <p id="post-status" class="hint"></p>
    <div class="actions">
      <button id="btn-push" class="btn secondary" hidden></button>
      <button id="btn-post-close" class="btn secondary" data-i18n="common.close">Stäng</button>
    </div>
  </div>
</div>

<!-- One tournament -->
<div id="contest" class="overlay" hidden>
  <div class="panel wide">
    <h2 id="contest-title" data-i18n="contest.title">Turnering</h2>
    <p id="contest-meta" class="hint left"></p>
    <div id="contest-invite" class="invite" hidden>
      <input id="contest-link" readonly aria-label="Länk">
      <button id="btn-contest-copy" class="btn secondary" data-i18n="contest.copy">Kopiera länk</button>
      <button id="btn-contest-share" class="btn secondary" hidden data-i18n="contest.share">Dela</button>
    </div>
    <div class="table-wrap"><table id="contest-table" class="standings"></table></div>
    <p id="contest-note" class="hint left"></p>
    <label id="contest-join-name" class="field" hidden><span data-i18n="post.name">Ditt namn</span><input id="opt-join-name" maxlength="24" autocomplete="nickname"></label>
    <p id="contest-status" class="hint"></p>
    <div class="actions">
      <button id="btn-contest-play" class="btn primary" hidden></button>
      <button id="btn-contest-join" class="btn primary" hidden data-i18n="contest.join">Gå med</button>
      <button id="btn-contest-push" class="btn secondary" hidden></button>
      <button id="btn-contest-end" class="btn secondary" hidden data-i18n="contest.end">Avsluta nu</button>
      <button id="btn-contest-leave" class="btn secondary" hidden data-i18n="contest.leave">Lämna</button>
      <button id="btn-contest-back" class="btn secondary" data-i18n="contest.back">Tillbaka</button>
    </div>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
