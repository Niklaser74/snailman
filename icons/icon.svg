<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Snailman: a yellow snail in a hedge maze, slime behind, lettuce ahead -->
  <defs>
    <clipPath id="r"><rect x="0" y="0" width="512" height="512" rx="96"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="512" height="512" fill="#4c9a3f"/>
    <!-- soil paths: a T with the snail on the crossbar -->
    <rect x="0" y="196" width="512" height="120" fill="#8b5a34"/>
    <rect x="196" y="316" width="120" height="196" fill="#8b5a34"/>
    <rect x="196" y="0" width="120" height="196" fill="#8b5a34"/>
    <!-- hedge shading -->
    <rect x="0" y="180" width="196" height="16" fill="#2f7a2b"/><rect x="316" y="180" width="196" height="16" fill="#2f7a2b"/>
    <rect x="0" y="316" width="196" height="18" fill="#6cc25a"/><rect x="316" y="316" width="196" height="18" fill="#6cc25a"/>
    <rect x="180" y="0" width="16" height="180" fill="rgba(0,0,0,0.12)"/><rect x="316" y="0" width="16" height="180" fill="rgba(255,255,255,0.12)"/>
    <rect x="180" y="334" width="16" height="178" fill="rgba(0,0,0,0.12)"/><rect x="316" y="334" width="16" height="178" fill="rgba(255,255,255,0.12)"/>
    <!-- slime trail behind, drying -->
    <path d="M60 256 H230" stroke="rgba(190,255,150,0.75)" stroke-width="48" stroke-linecap="round"/>
    <path d="M60 256 H140" stroke="rgba(190,255,150,0.5)" stroke-width="48" stroke-linecap="round"/>
    <circle cx="110" cy="244" r="8" fill="rgba(255,255,255,0.5)"/><circle cx="190" cy="244" r="8" fill="rgba(255,255,255,0.5)"/>
    <!-- lettuce ahead -->
    <g fill="#6cc25a" stroke="#3f8f3b" stroke-width="3">
      <ellipse cx="392" cy="256" rx="20" ry="14" transform="rotate(-20 392 256)"/>
      <ellipse cx="452" cy="256" rx="20" ry="14" transform="rotate(-20 452 256)"/>
      <ellipse cx="256" cy="400" rx="20" ry="14" transform="rotate(-20 256 400)"/>
      <ellipse cx="256" cy="460" rx="20" ry="14" transform="rotate(-20 256 460)"/>
      <ellipse cx="256" cy="60" rx="20" ry="14" transform="rotate(-20 256 60)"/>
      <ellipse cx="256" cy="120" rx="20" ry="14" transform="rotate(-20 256 120)"/>
    </g>
    <g fill="#bfe37a"><ellipse cx="388" cy="252" rx="10" ry="6" transform="rotate(-20 388 252)"/><ellipse cx="448" cy="252" rx="10" ry="6" transform="rotate(-20 448 252)"/></g>
  </g>
  <!-- snail: foot centred on the path, facing right -->
  <g transform="translate(262 296) scale(6.2)" stroke="#4a2e1c" stroke-width="1.6" stroke-linejoin="round">
    <path d="M-22 0 Q-24 -6 -14 -8 L10 -8 Q24 -12 23 -4 Q24 0 18 0 Z" fill="#e0a878"/>
    <path d="M4 -6 Q8 -20 18 -20 Q26 -20 24 -12 Q23 -6 16 -6 Z" fill="#e0a878"/>
    <circle cx="-6" cy="-15" r="13.5" fill="#f0c419"/>
    <path d="M-4.5 -15.5 a2 2 0 1 1 4 1.2 a5 5 0 1 1 -8.5 -3 a8.5 8.5 0 1 1 5 11" fill="none" stroke="#fff3d6" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M13 -19 Q15 -26 14 -31 M20 -19 Q24 -26 23 -34" fill="none" stroke="#e0a878" stroke-width="3.2" stroke-linecap="round"/>
    <circle cx="14" cy="-32" r="4.6" fill="#fff" stroke-width="1"/><circle cx="23" cy="-35" r="4.6" fill="#fff" stroke-width="1"/>
    <circle cx="15.5" cy="-32" r="2.2" fill="#1b1b1b" stroke="none"/><circle cx="24.5" cy="-35" r="2.2" fill="#1b1b1b" stroke="none"/>
  </g>
</svg>
